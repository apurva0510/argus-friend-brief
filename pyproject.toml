[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-friend-brief"
version = "0.1.0"
description = "A local Gemma research translator for Argus market snapshots"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic>=2.9,<3.0",
    "python-dotenv>=1.0,<2.0",
    "sentry-sdk>=2.22,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "streamlit>=1.44,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "ruff>=0.8,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
